
<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .group-title { font-weight: bold; font-size: 16px; margin-top: 20px; color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #999; padding: 8px; text-align: center; }
    .highlight { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Lab Report for {{patient_name}}</h2>
  <p>Age: {{age}}, Gender: {{gender}}</p>
  <p>Date: {{date}}</p>

  {{results_table}}

  <br><br>
  <div>
    <img src="{{doctor_signature}}" height="50"><br>
    <img src="{{doctor_stamp}}" height="50"><br>
    <strong>{{doctor_name}}</strong><br>
    {{doctor_designation}}
  </div>
</body>
</html>
